<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />

<title>Set Damn Password</title>
<style>
  html, body { margin: 0; background: #fff; color: #111; }

  main { max-width: 36rem; margin: 0 auto; padding: 4rem 1.5rem; }

  #rules .mark { color: #ff4d8d; font-weight: 700; }
  #ask {
    margin: 1.25rem 0 0.75rem;
    font-weight: 700;
    animation: rule-in 0.4s ease both;
  }
  button {
    display: block;
    margin: 0 0 0.75rem;
    border: 1px solid #222;
    background: #fff;
    color: #111;
    font: inherit;
    font-weight: 700;
    padding: 0.7rem 1rem;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  button:hover { border-color: #ff4d8d; color: #ff4d8d; }
  #login[hidden], #ask[hidden], #confirm[hidden] { display: none; }
  #login { margin-top: 2.5rem; animation: rule-in 0.4s ease both; }
  #login p { margin: 0 0 0.75rem; }
  #login-msg { min-height: 1.5rem; font-weight: 700; color: #ff4d8d; }
  #end[hidden] { display: none; }
  #end { margin-top: 2.5rem; animation: rule-in 0.45s ease both; }
  #end p { margin: 0 0 0.75rem; }
  .end-title {
    color: #ff4d8d;
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }
  #end-pw { font-weight: 700; overflow-wrap: anywhere; }
  @keyframes rule-back {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes title-lift {
    from { opacity: 0; transform: translateY(8px) scale(0.9); }
    to { opacity: 1; transform: none; }
  }
  @keyframes rule-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes pw-shake {
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
  }
  @media (prefers-reduced-motion: reduce) {
    h1 .hot, #rules p, #ask, #login, input, button { animation: none; transition: none; }
  }
</style>

<body>
<main>
  <h1><span class="hot">S</span>et <span class="hot">D</span>amn <span class="hot">P</span>assword</h1>

  <section id="login" hidden>

    <button id="enter" type="button">登录</button>

  </section>
  <section id="end" hidden>
    <p class="end-title">通关</p>
    <p id="end-count">13 条规则全部生效。</p>
    <p id="end-pw"></p>

const DIRECTIONS = ["ahead", "backward", "behind", "downward", "east", "forward", "left", "north", "northeast", "northwest", "right", "south", "southeast", "southwest", "upward", "west"];
const ROMANS = ["ii", "iv", "ix", "lv", "lx", "vi", "xc", "xi", "xl", "xv", "xx"];

function hasWord(pw, list) {
  const s = pw.toLowerCase();
  return list.some((w) => s.includes(w));
}
function hasSpecial(pw) {
  return [...pw].some((c) => SPECIALS.includes(c));
}
function palindromeHits(pw) {
  const hits = [];
  for (let i = 0; i < pw.length; i++) {
    for (let j = i + 4; j <= pw.length; j++) {
      const sub = pw.slice(i, j);
      let same = true;
      for (let a = 0, b = sub.length - 1; a < b; a++, b--) {
        if (sub[a] !== sub[b]) { same = false; break; }
      }
      if (same) {
        hits.push(sub);
        if (hits.length >= 3) return hits;
      }
    }
  }
  return hits;
}
function vowels(pw) {
  return (pw.match(/[aeiou]/gi) || []).length;
}
function digitCount(pw) {
  return (pw.match(/\d/g) || []).length;
}
function middleIsVowel(pw) {
  return /[aeiou]/i.test(pw[(pw.length - 1) >> 1] || "");
}

const RULES = [
  { test: (pw) => pw.length >= 8, text: () => "密码长度不少于8位" },
  { test: (pw) => /[a-z]/.test(pw) && /[A-Z]/.test(pw), text: () => "密码需包含大小写字母" },
  { test: (pw) => /\d/.test(pw), text: () => "密码需包含数字" },
  { test: hasSpecial, text: () => "密码需包含特殊字符" },
  { test: (pw) => hasWord(pw, FRUITS), text: () => "密码需包含一种水果的英文单词" },
  { test: (pw) => pw.includes("125"), text: () => "密码需包含一段1010101的八进制表示" },
  { test: (pw) => palindromeHits(pw).length === 0, text: () => "密码不得含有长度大于等于4的回文子串" },
  { test: (pw) => hasWord(pw, WEEKDAYS), text: () => "密码需包含任意一天的英文单词" },
  { test: (pw) => hasWord(pw, COLORS), text: () => "密码需包含一种颜色的英文单词" },
  { test: (pw) => /^[A-Z]/.test(pw) && hasSpecial(pw.slice(-1)), text: () => "密码需以大写字母开头，并以特殊字符结尾" },
  { test: (pw) => vowels(pw) % 2 === 0, text: () => "元音字母 aeiou 的个数必须是偶数" },
  { test: (pw) => hasWord(pw, ANIMALS), text: () => "密码需包含一种动物的英文单词" },
  { test: (pw) => pw.length % 2 === 1, text: () => "密码总长度必须是奇数" },
  { test: (pw) => hasWord(pw, MONTHS), text: () => "密码需包含一个月份的英文单词" },
  { test: (pw) => /(.)\1/.test(pw), text: () => "密码需包含连续两个相同的字母" },
  { test: (pw) => (pw.match(/[A-Z]/g) || []).length === 1, text: () => "密码中只能有一个大写字母" },
  { test: (pw) => hasWord(pw, COUNTRIES), text: () => "密码需包含一个国家的英文单词" },
  { test: (pw) => digitCount(pw) % 2 === 0, text: () => "密码中的数字个数必须是偶数" },
  { test: (pw) => pw.includes("?"), text: () => "密码需包含问号" },
  { test: (pw) => hasWord(pw, VEHICLES), text: () => "密码需包含一种交通工具的英文单词" },
  { test: (pw) => hasWord(pw, WEATHER), text: () => "密码需包含一种天气的英文单词" },
  { test: (pw) => hasWord(pw, JOBS), text: () => "密码需包含一种职业的英文单词" },
  { test: (pw) => hasWord(pw, FOODS), text: () => "密码需包含一种食物的英文单词" },
  { test: (pw) => hasWord(pw, SPORTS), text: () => "密码需包含一种运动的英文单词" },
  { test: (pw) => hasWord(pw, DRINKS), text: () => "密码需包含一种饮料的英文单词" },
  { test: (pw) => hasWord(pw, METALS), text: () => "密码需包含一种金属的英文单词" },
  { test: (pw) => hasWord(pw, DIRECTIONS), text: () => "密码需包含一个方向的英文单词" },
  { test: (pw) => pw.includes("."), text: () => "密码需包含小数点" },
  { test: (pw) => hasWord(pw, ROMANS), text: () => "密码需包含一个两字母的罗马数字" },
  { test: (pw) => pw.length > 30, text: () => "密码长度必须大于30" },
  { test: (pw) => pw.includes(String(pw.length)), text: () => "密码需包含当前总长度的十进制数字" },
  { test: middleIsVowel, text: () => "密码正中间的那个字符必须是元音" },
];

let unlocked = 1;
let phase = "edit";
let saved = "";
let wasPassing = [];
const rulesEl = document.getElementById("rules");
const pwEl = document.getElementById("pw");
const askEl = document.getElementById("ask");
const confirmBtn = document.getElementById("confirm");
const loginEl = document.getElementById("login");
const loginPwEl = document.getElementById("login-pw");
const loginMsgEl = document.getElementById("login-msg");

function advance(pw) {
  let n = unlocked;
  while (n < RULES.length && RULES.slice(0, n).every((rule) => rule.test(pw))) n += 1;
  unlocked = n;
}

function line(i, revived) {
  const p = document.createElement("p");
  if (revived) p.className = "back";
  const mark = document.createElement("span");
  mark.className = "mark";
  mark.textContent = "×";
  p.append(mark, document.createTextNode(" 规则" + (i + 1) + "：" + RULES[i].text()));
  return p;
}

function render() {
  if (phase !== "edit") return;
  const pw = pwEl.value;
  advance(pw);
  const allPass = unlocked === RULES.length && RULES.every((rule) => rule.test(pw));
  const passing = RULES.map((rule) => rule.test(pw));
  let revived = false;
  rulesEl.replaceChildren();
  for (let i = 0; i < unlocked; i++) {
    if (passing[i]) continue;
    const cameBack = wasPassing[i] === true && !passing[i];
    if (cameBack) revived = true;
    rulesEl.appendChild(line(i, cameBack));
  }
  askEl.hidden = !allPass;
  confirmBtn.hidden = !allPass;
  if (revived) {
    pwEl.classList.remove("bump");
    void pwEl.offsetWidth;
    pwEl.classList.add("bump");
  }
  wasPassing = passing;
}

confirmBtn.addEventListener("click", () => {
  if (phase !== "edit") return;
  const pw = pwEl.value;
  if (!(unlocked === RULES.length && RULES.every((rule) => rule.test(pw)))) return;
  saved = pw;
  phase = "login";
  rulesEl.replaceChildren();
  askEl.hidden = true;
  confirmBtn.hidden = true;
  pwEl.hidden = true;
  loginEl.hidden = false;
  loginPwEl.value = "";
  loginMsgEl.textContent = "";
  loginPwEl.focus();
});

function tryLogin() {
  if (phase !== "login") return;
  if (loginPwEl.value === saved) {
    phase = "won";
    loginEl.hidden = true;
    const endEl = document.getElementById("end");
    endEl.hidden = false;
    document.getElementById("end-count").textContent = RULES.length + " 条规则全部生效。";
    document.getElementById("end-pw").textContent = saved;
    return;
  }
  loginMsgEl.textContent = "密码错误";
  loginPwEl.value = "";
  loginPwEl.classList.remove("bump");
  void loginPwEl.offsetWidth;
  loginPwEl.classList.add("bump");
  loginPwEl.focus();
}

document.getElementById("enter").addEventListener("click", tryLogin);
loginPwEl.addEventListener("keydown", (event) => {
  if (event.key === "Enter") tryLogin();
});
pwEl.addEventListener("input", render);
render();
pwEl.focus();
</script>
